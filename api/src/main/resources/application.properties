spring.application.name=wealthlens-api

# Reuse the same .env as Docker and the Python pipeline (one place for credentials).
# "optional:" = don't crash if it's missing (e.g. on AWS, where real env vars are used).
spring.config.import=optional:file:../.env[.properties]

# Database connection. ${NAME:default} reads a variable, with a fallback after the colon.
# connectTimeout/socketTimeout (seconds): fail with a clear error instead of hanging
# forever if the database stops answering (e.g. Docker paused or crashed)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?connectTimeout=10&socketTimeout=60
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Give up waiting for a free pooled connection after 10 seconds (default is 30)
spring.datasource.hikari.connection-timeout=10000

# Flyway (in Docker) owns the schema. Hibernate only CHECKS that our Java classes match it.
spring.jpa.hibernate.ddl-auto=validate
# Close the DB session once the service layer is done (avoids hidden queries in controllers)
spring.jpa.open-in-view=false

# Expose only the health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- AI (Spring AI + Amazon Bedrock) ---
# Region and model come from .env, with safe defaults. Credentials are NOT set here:
# the AWS SDK finds them itself in C:\Users\<you>\.aws\credentials (from `aws configure`).
spring.ai.bedrock.aws.region=${AWS_REGION:eu-north-1}
# "eu." = an EU cross-region inference profile; the plain model ID isn't callable on-demand here
spring.ai.bedrock.converse.chat.model=${BEDROCK_MODEL_ID:eu.amazon.nova-2-lite-v1:0}
# Low temperature = consistent, factual wording (we want explanations, not creativity)
spring.ai.bedrock.converse.chat.temperature=0.2
# Hard cap on reply length: keeps answers short and costs predictable
spring.ai.bedrock.converse.chat.max-tokens=400
